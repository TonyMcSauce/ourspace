<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Our Space</title>
  <meta name="description" content="A private space for two." />
  <meta name="theme-color" content="#f3ece0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Our Space" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f3ece0'/%3E%3Cpath d='M32 47s-14-8.6-14-19a8 8 0 0 1 14-5.3A8 8 0 0 1 46 28c0 10.4-14 19-14 19Z' fill='%23c8382a'/%3E%3C/svg%3E"
  />

  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("ourspace_theme") || "null");
        var dark = saved === "dark" || (saved !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Homemade+Apple&family=Reenie+Beanie&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/memories.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/us.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
